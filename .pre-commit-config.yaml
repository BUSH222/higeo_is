repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        files: \.py$
        pass_filenames: true
        
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        files: \.py$
        pass_filenames: true
        
      - id: ty
        name: ty type checker
        entry: uv run ty check
        language: system
        files: \.py$
        pass_filenames: false